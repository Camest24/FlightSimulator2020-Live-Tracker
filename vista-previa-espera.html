<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>Pantalla de espera</title><style>
  :root{
    --glass-bg: rgba(18,22,30,0.40);
    --glass-brd: rgba(255,255,255,0.16);
    --bar-bg: rgba(255,255,255,0.10);
    --bar-brd: rgba(255,255,255,0.20);
    --row-border: rgba(255,255,255,0.12);
    --text: #f6f8fb;
    --text-dim: rgba(246,248,251,0.55);
    --accent: #3b82f6;
    --green: #4ade80;
    --orange: #fb923c;
    --amber: #fbbf24;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:'Archivo','Roboto',system-ui,sans-serif; overflow:hidden; background:#0b0e14; }
  /* Todo número va en mono con cifras de ancho fijo, para que no "salte" al actualizarse */
  .num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* Odómetro: cada dígito es una tira 0-9 que se desliza, como el altímetro de cabina.
     La altura de cada cifra es exactamente 1em, por eso el line-height va clavado en 1. */
  .odo{ display:inline-flex; align-items:flex-end; }
  /* 1ch = el ancho de un dígito; como la fuente de números es monoespaciada, calza exacto */
  .odo .od{ display:inline-block; width:1ch; height:1em; overflow:hidden; position:relative; }
  .odo .od-r{ display:block; transition:transform .5s cubic-bezier(.22,1,.3,1); }
  .odo .od-r span{ display:block; height:1em; line-height:1; }
  .odo .od-f{ display:inline-block; line-height:1; }
  @media (prefers-reduced-motion: reduce){ .odo .od-r{ transition:none; } }

  /* Los iconos responden al toque: crecen un pelo y se hunden al apretar */
  .tool-btn svg, .btn-sq svg, .btn svg, #compass svg, .fail-item .fi-ico{ transition:transform .22s cubic-bezier(.3,1.4,.5,1); }
  .tool-btn:hover svg, .btn-sq:hover svg{ transform:scale(1.14); }
  .tool-btn:active svg, .btn-sq:active svg, .btn:active svg{ transform:scale(.9); }
  .tool-btn.disabled:hover svg{ transform:none; }
  #btn-reset:hover svg{ transform:rotate(-180deg); }          /* la flechita de reinicio gira */
  #compass:hover svg{ transform:scale(1.08); }
  .fail-item:hover .fi-ico{ transform:rotate(12deg) scale(1.15); }
  /* Todo lo clicable se hunde rápido al apretar y vuelve despacio con un rebotito.
     La asimetría (0.06s al bajar, 0.4s al subir) es lo que lo hace sentir físico. */
  .tool-btn, .btn, .btn-sq, .rc-btn, .st-chip, .tile-steps button, .fail-item, .fail-repair,
  .off-reset, .hist-del, .fq-cancel, .layer-opt, .opt-item, .sp-item, .rr-btn, .fail-mode, .lp-btn{
    transition:transform .4s cubic-bezier(.2,1.5,.4,1), background .18s, color .18s, box-shadow .18s;
    -webkit-tap-highlight-color:transparent; }
  .tool-btn:active, .btn:active, .btn-sq:active, .rc-btn:active, .st-chip:active,
  .tile-steps button:active, .fail-item:active, .fail-repair:active, .off-reset:active,
  .hist-del:active, .fq-cancel:active, .layer-opt:active, .opt-item:active, .sp-item:active,
  .rr-btn:active, .fail-mode:active, .lp-btn:active{
    transform:scale(.93); transition-duration:.06s; }
  .tool-btn.disabled:active, .fail-repair:disabled:active, .rc-btn:disabled:active{ transform:none; }
  .pill .dot{ transition:background .3s; }
  #map{ position:absolute; inset:0; z-index:1; background:#0b0e14; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left{ display:none !important; }

  /* Pantalla de espera (tapa el mapa hasta tener una posición real, no el 0,0 del menú) */
  #waiting{ position:absolute; inset:0; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center; color:var(--text); background:rgba(11,14,20,0.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:opacity .4s; }
  #waiting.hidden{ opacity:0; pointer-events:none; }
  /* Ícono en dos capas: el avión va suelto encima del cuadro y flota como en crucero.
     El recorte del cuadro lo hace .w-icon, así el avión nunca se sale del borde. */
  #waiting .w-icon{ position:relative; width:112px; height:112px; border-radius:26px;
    overflow:hidden; filter:drop-shadow(0 16px 38px rgba(0,0,0,0.6)); }
  #waiting .w-icon img{ position:absolute; inset:0; width:100%; height:100%; }
  #waiting .w-icon-plane{ animation:volar 3.4s ease-in-out infinite; will-change:transform; }
  /* Sube y baja 5 px mientras se ladea 2,5°: el ciclo cierra donde empieza, sin salto */
  @keyframes volar{
    0%   { transform:translateY(3px)  rotate(-1.2deg); }
    25%  { transform:translateY(-2px) rotate(1.3deg); }
    50%  { transform:translateY(-4px) rotate(0.4deg); }
    75%  { transform:translateY(-1px) rotate(-1.6deg); }
    100% { transform:translateY(3px)  rotate(-1.2deg); }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .w-spinner{ width:30px; height:30px; border-radius:50%; border:3px solid rgba(255,255,255,0.15);
    border-top-color:var(--amber); animation:spin .9s linear infinite; }
  /* Cuando el sim ya respondió, la ruedita se cierra en verde y se queda quieta */
  #waiting.listo .w-spinner{ border-color:#4ade80; animation:none; }
  @media (prefers-reduced-motion: reduce){ .w-spinner, #waiting .w-icon-plane{ animation:none; } }

  /* Panel del gráfico de velocidad/altitud */
  /* El gráfico ya no tapa el mapa: cuelga debajo del panel de datos, en la misma columna */
  #graph-panel{ width:100%; flex:none; height:190px; border-radius:24px; padding:16px 18px 14px;
    color:var(--text); display:flex; flex-direction:column; }
  #graph-panel.hidden{ display:none; }
  .gp-head{ display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:10px; }
  #gp-close{ cursor:pointer; font-size:14px; opacity:.6; }
  #gp-close:hover{ opacity:1; }
  .gp-body{ flex:1; position:relative; min-height:0; }

  /* Botón de editar (junto a la altitud) + modal de ajuste */


  #fail-modal{ position:absolute; inset:0; z-index:2100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); }
  #fail-modal.hidden{ display:none; }
  .fail-card{ width:min(94vw,520px); max-height:84vh; border-radius:20px; padding:18px 20px 18px; color:var(--text); display:flex; flex-direction:column; }
  .fail-when{ margin-bottom:14px; }
  .fail-k{ display:block; font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:8px; }
  .fail-ctrl{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .fail-mode{ border:none; cursor:pointer; background:rgba(255,255,255,0.12); color:#fff; font-family:inherit;
    font-size:13px; font-weight:600; padding:8px 13px; border-radius:10px; }
  .fail-mode.on{ background:#2f6df6; }
  #fail-min{ width:76px; height:35px; border:none; border-radius:10px; background:rgba(255,255,255,0.08);
    color:#fff; text-align:center; font-family:inherit; font-size:13px; font-weight:600; outline:none; }
  #fail-body{ overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .fail-item{ display:flex; align-items:center; gap:9px; padding:10px 11px; border-radius:11px; cursor:pointer;
    background:rgba(255,255,255,0.06); font-size:13px; font-weight:500; transition:background .15s; }
  .fail-item:hover{ background:rgba(239,68,68,0.22); }
  .fail-item .fi-ico{ width:16px; height:16px; flex:none; color:#fca5a5; }
  /* Las que están rotas ahora mismo: un clic más las repara */
  .fail-item.roto{ background:rgba(239,68,68,0.28); color:#fecaca; }
  .fail-item.roto:hover{ background:rgba(74,222,128,0.24); color:#bbf7d0; }
  .fail-item.roto .fi-ico{ color:#fecaca; }
  .fail-repair{ width:100%; height:42px; margin-bottom:14px; border:none; border-radius:13px; cursor:pointer;
    background:rgba(74,222,128,0.22); color:#bbf7d0; font-family:inherit; font-size:13.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .fail-repair:hover:not(:disabled){ background:rgba(74,222,128,0.34); }
  .fail-repair:disabled{ opacity:.4; cursor:default; }
  #fail-queue{ margin-top:12px; }
  .fq-item{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-top:1px solid var(--row-border); font-size:12.5px; }
  .fq-name{ flex:1; }
  .fq-time{ font-weight:700; color:#fb923c; font-variant-numeric:tabular-nums; }
  .fq-cancel{ border:none; cursor:pointer; background:rgba(255,255,255,0.14); color:#fff; border-radius:8px;
    font-size:11.5px; font-weight:600; padding:5px 9px; }

  /* Menú de rutas alternativas */
  #opts-modal{ position:absolute; inset:0; z-index:2100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); }
  #opts-modal.hidden{ display:none; }
  #opts-body{ max-height:62vh; overflow-y:auto; }
  .opt-item{ display:flex; align-items:center; gap:12px; padding:12px 10px; border-radius:12px; cursor:pointer;
    border:1px solid transparent; transition:background .15s; }
  .opt-item:hover{ background:rgba(255,255,255,0.08); border-color:var(--border-strong); }
  .opt-main{ flex:1; min-width:0; }
  .opt-awy{ font-size:14.5px; font-weight:700; letter-spacing:.3px; color:#7dd3fc; }
  .opt-pts{ font-size:12px; color:var(--text-dim); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .opt-nums{ text-align:right; font-size:13.5px; font-weight:700; white-space:nowrap; }
  .opt-nums span{ display:block; font-size:11.5px; font-weight:500; color:var(--text-dim); margin-top:3px; }

  /* Historial de vuelos */
  #hist-modal{ position:absolute; inset:0; z-index:2100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); }
  #hist-modal.hidden{ display:none; }
  .hist-card{ width:min(94vw,520px); max-height:80vh; border-radius:20px; padding:18px 20px 16px; color:var(--text); display:flex; flex-direction:column; }
  #hist-body{ overflow-y:auto; margin-right:-6px; padding-right:6px; }
  .hist-item{ display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--row-border); }
  .hist-main{ flex:1; min-width:0; }
  .hist-route{ font-size:15px; font-weight:700; letter-spacing:-0.2px; }
  .hist-sub{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .hist-nums{ text-align:right; font-size:13px; font-weight:600; white-space:nowrap; }
  .hist-nums span{ display:block; font-size:11px; color:var(--text-dim); font-weight:500; margin-top:3px; white-space:nowrap; }
  .hist-del{ border:none; cursor:pointer; background:rgba(239,68,68,0.16); color:#fca5a5; width:30px; height:30px;
    border-radius:9px; font-size:15px; flex:none; display:flex; align-items:center; justify-content:center; }
  .hist-del:hover{ background:rgba(239,68,68,0.3); }
  .hist-empty{ color:var(--text-dim); font-size:14px; padding:22px 4px; text-align:center; }

  /* Panel de estado del avión */
  #status-modal{ position:absolute; inset:0; z-index:2100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); }
  #status-modal.hidden{ display:none; }
  .st-card{ width:min(92vw,430px); border-radius:20px; padding:18px 20px 20px; color:var(--text); }
  .st-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 2px; border-bottom:1px solid var(--row-border); }
  .st-label{ color:var(--text-dim); font-size:14px; font-weight:500; }
  .st-val{ font-size:14px; font-weight:600; text-align:right; }
  .st-val.on{ color:#4ade80; } .st-val.off{ color:var(--text-dim); }
  /* Corrimiento horizontal del avión cuando el mapa lo sigue: el panel de datos tapa la
     izquierda, así que a veces conviene empujarlo hacia la derecha. */
  .off-box{ padding:14px 15px 12px; border-radius:16px; background:rgba(255,255,255,0.06); margin-bottom:16px; }
  .off-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .off-k{ font-size:13px; font-weight:600; color:var(--text); }
  .off-v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--text-dim); }
  #off-x{ -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; outline:none; cursor:pointer;
    background:linear-gradient(90deg,rgba(255,255,255,0.14),rgba(251,191,36,0.35),rgba(255,255,255,0.14)); }
  #off-x::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--amber); border:none; cursor:pointer; box-shadow:0 3px 10px rgba(251,191,36,0.45); transition:transform .15s; }
  #off-x::-webkit-slider-thumb:hover{ transform:scale(1.15); }
  #off-x::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--amber); border:none; cursor:pointer; }
  .off-scale{ display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:var(--text-dim); margin-top:10px; }
  .off-reset{ border:none; cursor:pointer; background:rgba(255,255,255,0.12); color:var(--text);
    font-family:inherit; font-size:11px; font-weight:600; padding:5px 11px; border-radius:9px; }
  .off-reset:hover{ background:rgba(255,255,255,0.24); }

  .st-chips{ display:flex; gap:8px; flex-wrap:wrap; width:100%; }
  .st-chip{ flex:1; min-width:88px; text-align:center; font-size:13px; font-weight:600; padding:13px 10px;
    border-radius:14px; background:rgba(255,255,255,0.08); color:var(--text-dim); cursor:pointer; transition:background .15s,color .15s; }
  .st-chip:hover{ background:rgba(255,255,255,0.16); color:#fff; }
  .st-chip.on{ background:var(--amber); color:#1a1204; box-shadow:0 6px 18px rgba(251,191,36,0.3); }
  .st-chip.on:hover{ background:#fcc94a; color:#1a1204; }
  .st-mid{ display:flex; align-items:center; gap:8px; }
  .st-btn{ border:none; border-radius:8px; background:rgba(255,255,255,0.14); color:#fff; font-size:12px; font-weight:700; padding:6px 11px; cursor:pointer; }
  .st-btn:hover{ background:rgba(255,255,255,0.24); }
  .st-btn.st-green{ background:rgba(52,199,89,0.28); color:#7ee2a0; }
  .st-btn.st-red{ background:rgba(239,68,68,0.22); color:#fca5a5; }

  /* Contador de bajada de tren (teleporte de despegue) */
  #gear-wait{ position:absolute; inset:0; z-index:2200; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); }
  #gear-wait.hidden{ display:none; }
  .gw-card{ border-radius:20px; padding:26px 34px; text-align:center; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .gw-title{ font-size:15px; font-weight:600; margin-top:8px; }
  .gw-pct{ font-size:42px; font-weight:800; color:#38bdf8; line-height:1.1; }
  .gw-sub{ font-size:12px; color:var(--text-dim); }

  /* Menú que aparece al mantener pulsado un punto del mapa */
  /* width:max-content => el marcador no se estira al ancho del contenedor del mapa */
  .lp-menu{ display:flex; align-items:center; gap:6px; padding:6px; border-radius:14px;
    width:max-content; max-width:none; flex:none; }
  .lp-btn{ border:none; cursor:pointer; font-family:'Roboto',sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 12px; border-radius:9px; color:#fff; background:#2f6df6; white-space:nowrap; transition:filter .15s; }
  .lp-btn:hover{ filter:brightness(1.14); }
  .lp-btn.lp-wp{ background:#a855f7; }
  .lp-btn.lp-x{ background:rgba(255,255,255,0.16); padding:8px 10px; }

  /* Botón "+ punto" del chip de ruta */
  .rc-btn{ border:none; border-radius:18px; height:36px; padding:0 15px; background:rgba(168,85,247,0.55); color:#fff;
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:filter .15s; }
  .rc-btn:hover{ filter:brightness(1.15); }
  .rc-btn.on{ background:#a855f7; }
  .rc-btn.rc-mcdu{ background:rgba(14,165,233,0.5); }
  .rc-btn.rc-x{ width:36px; padding:0; background:rgba(255,255,255,0.12); color:var(--text-dim); font-size:12px; }
  .rc-btn:disabled{ opacity:.55; cursor:default; }

  /* Aviso de hora de llegada (aparece 10s al crear/cambiar la ruta) */
  #eta-toast{ position:absolute; top:78px; left:50%; transform:translateX(-50%); z-index:1700; padding:12px 20px; border-radius:14px; font-size:14.5px; font-weight:700; color:var(--text); white-space:nowrap; }
  #eta-toast.hidden{ display:none; }

  /* Buscador de aeropuertos */
  #search-panel{ position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:1600; width:min(92vw,440px); }
  #search-panel.hidden{ display:none; }
  .sp-box{ border-radius:16px; padding:6px; }
  .sp-top{ display:flex; align-items:center; gap:9px; padding:8px 10px; color:var(--text-dim); }
  #sp-input{ flex:1; background:transparent; border:none; color:var(--text); font-size:15px; font-family:'Roboto',sans-serif; outline:none; }
  #sp-close{ cursor:pointer; }
  #sp-results{ max-height:52vh; overflow-y:auto; }
  .sp-item{ display:flex; align-items:center; gap:12px; padding:9px 11px; border-radius:10px; cursor:pointer; }
  .sp-item:hover{ background:rgba(255,255,255,0.08); }
  .sp-item .sp-icao{ font-weight:700; font-size:14px; min-width:54px; color:var(--text); }
  .sp-item .sp-name{ color:var(--text-dim); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Dos variantes de vidrio: paneles de datos (oscuro, legible) y barras flotantes (claro) */
  .glass{ background:var(--glass-bg); border:1px solid var(--glass-brd);
    backdrop-filter:blur(34px) saturate(190%); -webkit-backdrop-filter:blur(34px) saturate(190%);
    box-shadow:0 22px 55px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.28); position:relative; }
  .glass::before{ content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 42%); }
  .glass.bar{ background:var(--bar-bg); border-color:var(--bar-brd);
    box-shadow:0 18px 44px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.35); }

  /* La columna entera hace scroll si no entra; así el panel de datos NUNCA se comprime
     cuando se abre el gráfico (antes le cortaba las últimas filas). */
  #left-stack{ position:absolute; top:26px; left:26px; z-index:1000; width:346px; display:flex; flex-direction:column;
    gap:12px; max-height:calc(100% - 52px); overflow-y:auto; scrollbar-width:none; padding-right:2px; }
  #left-stack::-webkit-scrollbar{ display:none; }

  /* Barra de título: ahora vive fuera de la tarjeta de datos */

  #panel{ width:100%; flex:none; border-radius:24px; color:var(--text); padding:20px 20px 18px; }


  /* Dato principal: altitud y velocidad, uno al lado del otro */
  .hero{ display:flex; gap:20px; }
  .hero-cell{ flex:1; min-width:0; }
  .hero-k{ display:block; font-size:11px; font-weight:500; color:var(--text-dim); }
  /* flex-end en vez de baseline: los rodillos del odómetro recortan por abajo y su
     "baseline" no es la de una cifra normal, así la unidad no queda flotando */
  .hero-v{ display:flex; align-items:flex-end; gap:5px; margin-top:8px; }
  .hero-v .u{ padding-bottom:0.1em; }
  .hero-v .n{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:30px; font-weight:500; line-height:1; letter-spacing:-1px; }
  .hero-v .u{ font-size:12px; color:var(--text-dim); }
  .hero-sub{ display:block; font-size:11px; font-weight:400; color:var(--text-dim); margin-top:8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero-sub.green{ color:var(--green); } .hero-sub.orange{ color:var(--orange); }

  /* Fila de fichas: rumbo, distancia, sim rate */
  .tiles{ display:flex; gap:8px; margin-top:18px; }
  .tile{ flex:1; min-width:0; padding:11px 12px; border-radius:14px; background:rgba(255,255,255,0.08); position:relative; }
  .tile-k{ display:block; font-size:10.5px; font-weight:500; color:var(--text-dim); }
  .tile-v{ display:block; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:500; margin-top:7px; }
  .tile-v{ display:flex; align-items:flex-end; }
  .tile-v .uu{ font-family:'Archivo',sans-serif; font-size:10.5px; color:var(--text-dim); margin-left:3px; padding-bottom:0.15em; }
  .tile-v.orange{ color:var(--orange); }
  .tile-sub{ display:block; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:10.5px; color:var(--text-dim); margin-top:4px; }
  /* Los − + del sim rate viven dentro de la ficha, sin robarle sitio al número */
  .tile-steps{ position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:4px; }

  .panel-foot{ display:flex; gap:8px; margin-top:18px; }
